name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend — ruff + pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flobrief_test
          POSTGRES_USER: flobrief
          POSTGRES_PASSWORD: flobrief
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install dependencies
        working-directory: apps/backend
        run: pip install -r requirements.txt

      - name: Ruff lint
        working-directory: apps/backend
        run: python -m ruff check .

      - name: Ruff format check
        working-directory: apps/backend
        run: python -m ruff format --check .

      - name: Run tests
        working-directory: apps/backend
        env:
          SECRET_KEY: ci-test-secret-key-flobrief-64-chars-xxxxxxxxxxxxxxxxxxxx
          DATABASE_URL: postgresql+asyncpg://flobrief:flobrief@localhost:5432/flobrief_test
        run: python -m pytest -x -q

  frontend:
    name: Frontend — tsc + next build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: TypeScript check
        working-directory: apps/frontend
        run: npx tsc --noEmit

      - name: Next.js build
        working-directory: apps/frontend
        env:
          DOCKER_BUILD: "true"
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000
        run: npm run build
