name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend — ruff + pytest
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-secret-key-flobrief-64-chars-xxxxxxxxxxxxxxxxxxxx
      DATABASE_URL: postgresql+asyncpg://flobrief:flobrief@localhost:5432/flobrief_test
      FLOBRIEF_SECRET_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      TOTP_ENCRYPTION_KEY: MTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTE=

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flobrief_test
          POSTGRES_USER: flobrief
          POSTGRES_PASSWORD: flobrief
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install dependencies
        working-directory: apps/backend
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Ruff lint
        working-directory: apps/backend
        run: python -m ruff check .

      - name: Ruff format check
        working-directory: apps/backend
        run: python -m ruff format --check .

      - name: Apply database migrations
        working-directory: apps/backend
        run: python -m alembic upgrade head

      - name: Run tests
        working-directory: apps/backend
        run: python -m pytest -x -q

  frontend:
    name: Frontend — tsc + next build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: TypeScript check
        working-directory: apps/frontend
        run: npx tsc --noEmit

      - name: Next.js build
        working-directory: apps/frontend
        env:
          DOCKER_BUILD: "true"
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000
        run: npm run build

  deploy_hetzner:
    name: Deploy — Hetzner production
    needs: [backend, frontend]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      vars.HETZNER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: flobrief-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
          HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
          HETZNER_SSH_PORT: ${{ vars.HETZNER_SSH_PORT }}
          HETZNER_APP_DIR: ${{ vars.HETZNER_APP_DIR }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          set -Eeuo pipefail

          for name in HETZNER_HOST HETZNER_SSH_USER HETZNER_SSH_PRIVATE_KEY HETZNER_KNOWN_HOSTS HETZNER_APP_DIR PRODUCTION_URL; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub production setting: ${name}" >&2
              exit 1
            fi
          done

          [[ "$HETZNER_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "HETZNER_HOST must be a DNS name or IPv4 address" >&2; exit 1; }
          [[ "$HETZNER_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "HETZNER_SSH_USER is invalid" >&2; exit 1; }
          [[ "${HETZNER_SSH_PORT:-22}" =~ ^[0-9]{1,5}$ ]] || { echo "HETZNER_SSH_PORT is invalid" >&2; exit 1; }
          [[ "$HETZNER_APP_DIR" =~ ^/[A-Za-z0-9._/-]+$ && "$HETZNER_APP_DIR" != "/" ]] || { echo "HETZNER_APP_DIR must be a safe absolute path" >&2; exit 1; }
          [[ "$PRODUCTION_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?/?$ ]] || { echo "PRODUCTION_URL must be an HTTPS origin" >&2; exit 1; }

      - name: Configure SSH
        env:
          HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          (umask 077 && printf '%s\n' "$HETZNER_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519")
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy verified commit
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
          HETZNER_SSH_PORT: ${{ vars.HETZNER_SSH_PORT }}
          HETZNER_APP_DIR: ${{ vars.HETZNER_APP_DIR }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          ssh_port="${HETZNER_SSH_PORT:-22}"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -p "$ssh_port" \
            "$HETZNER_SSH_USER@$HETZNER_HOST" \
            "bash -s -- '$HETZNER_APP_DIR' '$RELEASE_SHA' '$PRODUCTION_URL'" \
            < scripts/deploy_hetzner.sh
