services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flobrief}
      POSTGRES_USER: ${POSTGRES_USER:-flobrief}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flobrief}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: flobrief-backend:${RELEASE_SHA:-latest}
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./apps/backend/.env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    image: flobrief-frontend:${RELEASE_SHA:-latest}
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://postpiloter.com}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://postpiloter.com}
        NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ${NEXT_PUBLIC_PADDLE_CLIENT_TOKEN:?NEXT_PUBLIC_PADDLE_CLIENT_TOKEN is required}
        NEXT_PUBLIC_PADDLE_PRICE_BRAND_SOLO_MONTHLY: ${NEXT_PUBLIC_PADDLE_PRICE_BRAND_SOLO_MONTHLY:?Brand Solo monthly Paddle price is required}
        NEXT_PUBLIC_PADDLE_PRICE_BRAND_SOLO_YEARLY: ${NEXT_PUBLIC_PADDLE_PRICE_BRAND_SOLO_YEARLY:?Brand Solo yearly Paddle price is required}
        NEXT_PUBLIC_PADDLE_PRICE_STARTER_AGENCY_MONTHLY: ${NEXT_PUBLIC_PADDLE_PRICE_STARTER_AGENCY_MONTHLY:?Starter Agency monthly Paddle price is required}
        NEXT_PUBLIC_PADDLE_PRICE_STARTER_AGENCY_YEARLY: ${NEXT_PUBLIC_PADDLE_PRICE_STARTER_AGENCY_YEARLY:?Starter Agency yearly Paddle price is required}
        NEXT_PUBLIC_PADDLE_PRICE_PRO_AGENCY_MONTHLY: ${NEXT_PUBLIC_PADDLE_PRICE_PRO_AGENCY_MONTHLY:?Pro Agency monthly Paddle price is required}
        NEXT_PUBLIC_PADDLE_PRICE_PRO_AGENCY_YEARLY: ${NEXT_PUBLIC_PADDLE_PRICE_PRO_AGENCY_YEARLY:?Pro Agency yearly Paddle price is required}
        NEXT_PUBLIC_PADDLE_PRICE_AGENCY_PLUS_MONTHLY: ${NEXT_PUBLIC_PADDLE_PRICE_AGENCY_PLUS_MONTHLY:?Agency Plus monthly Paddle price is required}
        NEXT_PUBLIC_PADDLE_PRICE_AGENCY_PLUS_YEARLY: ${NEXT_PUBLIC_PADDLE_PRICE_AGENCY_PLUS_YEARLY:?Agency Plus yearly Paddle price is required}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://postpiloter.com}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://postpiloter.com}
    expose:
      - "3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  media_data:
  nginx_logs:
